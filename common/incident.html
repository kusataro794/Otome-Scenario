<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1820" />
  <title>COMMON ROUTE / INCIDENT ― なくした鍵</title>
  <style>
    :root{
      --bg:#141217;
      --panel:#201c24;
      --panel-2:#28222e;
      --text:#f6f0f5;
      --muted:#bcb1be;
      --line:rgba(255,255,255,.12);
      --accent:#e8a7bd;
      --accent-2:#a6b9e9;
      --danger:#dc7b8f;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100svh;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(232,167,189,.14), transparent 32%),
        radial-gradient(circle at 100% 20%, rgba(166,185,233,.11), transparent 34%),
        linear-gradient(180deg,#17131a 0%,#101015 100%);
      font-family:
        "Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",
        system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    }

    button{font:inherit}
    button:focus-visible{
      outline:3px solid rgba(232,167,189,.55);
      outline-offset:3px;
    }

    .app{
      width:min(960px,100%);
      min-height:100svh;
      margin:0 auto;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
      background:linear-gradient(180deg,rgba(20,18,23,.95),rgba(20,18,23,.72));
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .brand{
      min-width:0;
    }

    .eyebrow{
      margin:0 0 3px;
      color:var(--accent);
      font-size:11px;
      letter-spacing:.18em;
      font-weight:800;
    }

    .title{
      margin:0;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .top-actions{
      display:flex;
      gap:8px;
      flex:0 0 auto;
    }

    .icon-btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      border-radius:12px;
      min-width:42px;
      min-height:42px;
      padding:0 11px;
      cursor:pointer;
    }

    .nav-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
    }

    .icon-btn:hover{background:rgba(255,255,255,.08)}

    .progress{
      height:3px;
      background:rgba(255,255,255,.06);
      overflow:hidden;
    }

    .progress > span{
      display:block;
      height:100%;
      width:0;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      transition:width .35s ease;
    }

    main{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      min-height:calc(100svh - 80px);
      padding:24px 16px calc(22px + env(safe-area-inset-bottom));
    }

    .stage{
      width:min(820px,100%);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .scene-header{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:12px;
      padding:0 4px;
    }

    .scene-no{
      font-size:11px;
      letter-spacing:.16em;
      color:var(--muted);
      font-weight:800;
    }

    .scene-title{
      margin:3px 0 0;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:clamp(20px,5vw,30px);
      letter-spacing:.05em;
    }

    .route-hint{
      font-size:11px;
      color:var(--muted);
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 9px;
      white-space:nowrap;
    }

    .textbox{
      position:relative;
      min-height:250px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:
        linear-gradient(180deg,rgba(41,34,46,.96),rgba(28,24,32,.98));
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .textbox::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg,rgba(232,167,189,.06),transparent 35%),
        linear-gradient(315deg,rgba(166,185,233,.05),transparent 32%);
      pointer-events:none;
    }

    .speaker{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:18px 18px 0;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.075);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      font-size:13px;
      font-weight:800;
      letter-spacing:.04em;
    }

    .speaker.hidden{display:none}

    .speaker.reo::before,
    .speaker.minato::before,
    .speaker.yui::before{
      content:"";
      width:8px;height:8px;border-radius:50%;
    }
    .speaker.reo::before{background:var(--accent)}
    .speaker.minato::before{background:var(--accent-2)}
    .speaker.yui::before{background:#ddd}

    .line{
      position:relative;
      margin:0;
      padding:20px 20px 18px;
      min-height:156px;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:clamp(17px,4.4vw,21px);
      line-height:2;
      letter-spacing:.025em;
      white-space:pre-wrap;
    }

    .line.narration{
      color:#efe8ed;
    }

    .page-block + .page-block{
      margin-top:16px;
      padding-top:15px;
      border-top:1px solid rgba(255,255,255,.07);
    }

    .inline-speaker{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:6px;
      font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
      font-size:12px;
      font-weight:900;
      letter-spacing:.06em;
    }

    .inline-speaker::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:#ddd;
    }

    .inline-speaker.reo{color:#f2c2d2}
    .inline-speaker.reo::before{background:var(--accent)}
    .inline-speaker.minato{color:#c5d1f3}
    .inline-speaker.minato::before{background:var(--accent-2)}
    .inline-speaker.yui{color:#f2eef1}

    .dialogue-text,
    .narration-text{
      white-space:pre-wrap;
    }

    .narration-text{
      color:#efe8ed;
    }

    .continue-row{
      position:relative;
      display:flex;
      justify-content:flex-end;
      padding:0 18px 16px;
    }

    .next-btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:0;
      color:var(--text);
      background:transparent;
      cursor:pointer;
      padding:8px 4px;
      font-weight:800;
      letter-spacing:.08em;
    }

    .next-btn::after{
      content:"";
      width:9px;height:9px;
      border-right:2px solid var(--accent);
      border-bottom:2px solid var(--accent);
      transform:rotate(-45deg);
    }

    .choice-wrap{
      display:grid;
      gap:10px;
      animation:fadeUp .35s ease both;
    }

    .choice-title{
      text-align:center;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:15px;
      color:#eee5eb;
      margin:1px 0 5px;
      letter-spacing:.08em;
    }

    .choice-btn{
      width:100%;
      border:1px solid rgba(255,255,255,.13);
      color:var(--text);
      background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
      border-radius:16px;
      padding:15px 16px;
      min-height:58px;
      cursor:pointer;
      text-align:left;
      box-shadow:0 7px 26px rgba(0,0,0,.16);
      transition:transform .15s ease,background .15s ease,border-color .15s ease;
    }

    .choice-btn:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.085);
      border-color:rgba(232,167,189,.35);
    }

    .choice-num{
      display:inline-grid;
      place-items:center;
      width:24px;height:24px;
      margin-right:8px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.16);
      color:var(--accent);
      font-size:11px;
      font-weight:900;
    }

    .system-message{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
      min-height:18px;
    }

    .chapter-end{
      text-align:center;
      padding:40px 18px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.035);
      box-shadow:var(--shadow);
      animation:fadeUp .5s ease both;
    }

    .chapter-end .small{
      color:var(--muted);
      font-size:11px;
      letter-spacing:.2em;
      font-weight:800;
    }

    .chapter-end h2{
      margin:14px 0 8px;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:clamp(24px,7vw,38px);
      font-weight:700;
    }

    .chapter-end p{
      margin:8px auto;
      max-width:34em;
      color:#eee5eb;
      line-height:1.9;
    }

    .end-actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-top:24px;
    }

    .primary,.secondary{
      border-radius:14px;
      min-height:48px;
      padding:0 18px;
      cursor:pointer;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .primary{
      border:0;
      background:linear-gradient(135deg,var(--accent),#d886a3);
      color:#25141b;
    }

    .secondary{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
    }

    dialog{
      width:min(760px,calc(100% - 24px));
      max-height:min(78svh,760px);
      border:1px solid var(--line);
      border-radius:20px;
      color:var(--text);
      background:#1d1921;
      box-shadow:var(--shadow);
      padding:0;
    }

    dialog::backdrop{
      background:rgba(0,0,0,.68);
      backdrop-filter:blur(5px);
    }

    .modal-head{
      position:sticky;
      top:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 16px;
      background:rgba(29,25,33,.96);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
      z-index:1;
    }

    .modal-head h3{margin:0;font-size:15px}

    .modal-body{
      padding:14px 16px 22px;
      overflow:auto;
      max-height:calc(78svh - 65px);
    }

    .log-item{
      padding:12px 2px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .log-name{
      font-size:11px;
      font-weight:900;
      color:var(--accent);
      margin-bottom:5px;
    }

    .log-text{
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      line-height:1.8;
      white-space:pre-wrap;
      color:#eee8ec;
    }

    .save-note{
      position:fixed;
      left:50%;
      bottom:calc(22px + env(safe-area-inset-bottom));
      transform:translate(-50%,20px);
      opacity:0;
      z-index:50;
      background:#2c2630;
      border:1px solid var(--line);
      border-radius:999px;
      padding:9px 13px;
      color:#f7f1f5;
      font-size:12px;
      pointer-events:none;
      transition:.25s ease;
      box-shadow:0 8px 26px rgba(0,0,0,.35);
    }
    .save-note.show{opacity:1;transform:translate(-50%,0)}

    .resume-banner{
      display:none;
      width:min(820px,100%);
      margin:0 auto 12px;
      border:1px solid rgba(232,167,189,.25);
      background:rgba(232,167,189,.08);
      border-radius:14px;
      padding:12px 14px;
      color:#f2e6eb;
      font-size:13px;
      line-height:1.7;
    }
    .resume-banner.show{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .resume-banner button{
      flex:0 0 auto;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }

    @media (max-width:560px){
      .topbar{padding-left:10px;padding-right:10px;gap:8px}
      .eyebrow{font-size:9px}
      .title{font-size:12px}
      .top-actions{gap:5px}
      .icon-btn{min-width:36px;min-height:36px;padding:0 7px}
      .nav-link{font-size:9px}
      main{padding-left:12px;padding-right:12px}
      .route-hint{display:none}
      .textbox{min-height:290px}
      .line{padding:18px 17px 15px;min-height:180px}
      .speaker{margin-left:15px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto !important;animation:none !important;transition:none !important}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">COMMON ROUTE / INCIDENT</p>
        <h1 class="title">なくした鍵</h1>
      </div>
      <div class="top-actions">
        <a class="icon-btn nav-link" href="../index.html" aria-label="シナリオ一覧へ戻る">TOP</a>
        <a class="icon-btn nav-link" href="intro.html" aria-label="イントロへ戻る">INTRO</a>
        <button class="icon-btn" id="logBtn" type="button" aria-label="バックログ">LOG</button>
        <button class="icon-btn" id="restartBtn" type="button" aria-label="最初から">↻</button>
      </div>
    </header>

    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

    <main>
      <div class="resume-banner" id="resumeBanner">
        <span>前回の続きから再開しました。</span>
        <button type="button" id="dismissResume">閉じる</button>
      </div>

      <section class="stage" id="stage" aria-live="polite">
        <div class="scene-header" id="sceneHeader">
          <div>
            <div class="scene-no" id="sceneNo">SCENE 01</div>
            <h2 class="scene-title" id="sceneTitle">朝 ―― いつも通りのはずだった</h2>
          </div>
          <div class="route-hint">AUTO SAVE</div>
        </div>

        <div class="textbox" id="textbox">
          <div class="speaker hidden" id="speaker"></div>
          <div class="line narration" id="line"></div>
          <div class="continue-row">
            <button type="button" class="next-btn" id="nextBtn">NEXT</button>
          </div>
        </div>

        <div class="choice-wrap" id="choices" hidden></div>
        <div class="system-message" id="systemMessage"></div>
      </section>
    </main>
  </div>

  <dialog id="logDialog">
    <div class="modal-head">
      <h3>BACKLOG</h3>
      <button class="icon-btn" id="closeLogBtn" type="button">閉じる</button>
    </div>
    <div class="modal-body" id="logBody"></div>
  </dialog>

  <div class="save-note" id="saveNote">保存しました</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "otome_incident_v1";
  const STORY_STATE_KEY = "otome_story_state_v1";

  const rawScenes = [
    {
      no:"SCENE 01",
      title:"朝 ―― いつも通りのはずだった",
      steps:[
        {t:"朝。\n\nキッチンから、卵の焼ける匂いがする。\n\n結衣はまだ半分眠ったまま、リビングへ向かった。"},
        {s:"玲央",c:"reo",t:"姉さん、おはよう"},
        {s:"結衣",c:"yui",t:"……おはよ……"},
        {s:"玲央",c:"reo",t:"まだ寝てる？"},
        {s:"結衣",c:"yui",t:"起きてるよ"},
        {s:"玲央",c:"reo",t:"じゃあ、そのまま壁にぶつかりそうなのは何？"},
        {t:"顔を上げる。\n\n目の前に壁。"},
        {s:"結衣",c:"yui",t:"…………"},
        {s:"玲央",c:"reo",t:"危な"},
        {t:"肩を引かれる。\n\nそのまま、背中が玲央の胸元へ軽くぶつかった。"},
        {s:"結衣",c:"yui",t:"わ"},
        {s:"玲央",c:"reo",t:"ほんと、朝は危なっかしいね"},
        {t:"耳元で小さく笑う声。\n\n近い。\n\nそう思って一歩離れると、玲央は何でもないような顔で結衣の前髪を指先で整えた。"},
        {s:"玲央",c:"reo",t:"寝癖"},
        {s:"結衣",c:"yui",t:"うそ"},
        {s:"玲央",c:"reo",t:"本当"},
        {s:"結衣",c:"yui",t:"あとで直す"},
        {s:"玲央",c:"reo",t:"もう直した"},
        {s:"結衣",c:"yui",t:"……ありがと"},
        {s:"玲央",c:"reo",t:"どういたしまして"},
        {t:"玲央は満足そうに微笑み、キッチンへ戻っていく。\n\nテーブルには朝食。\n\n目玉焼き。トースト。サラダ。"},
        {s:"結衣",c:"yui",t:"玲央はすごいねえ"},
        {s:"玲央",c:"reo",t:"何が？"},
        {s:"結衣",c:"yui",t:"朝からちゃんと人間の食べ物を作れる"},
        {s:"玲央",c:"reo",t:"姉さんの中で俺は何と比較されてるの？"},
        {s:"結衣",c:"yui",t:"私"},
        {s:"玲央",c:"reo",t:"ああ……"},
        {t:"玲央が妙に納得した顔をする。"},
        {s:"結衣",c:"yui",t:"今ちょっと失礼じゃなかった？"},
        {s:"玲央",c:"reo",t:"事実確認しただけ"},
        {s:"結衣",c:"yui",t:"むう"},
        {s:"玲央",c:"reo",t:"ほら、食べて。今日一限あるんでしょ"},
        {s:"結衣",c:"yui",t:"あ"},
        {t:"時計を見る。"},
        {s:"結衣",c:"yui",t:"……まずい"},
        {s:"玲央",c:"reo",t:"だから言ったのに"},
        {t:"慌てて朝食を口に運び、支度を済ませる。\n\nバッグ。スマホ。財布。イヤホン。\n\n――鍵。"},
        {s:"結衣",c:"yui",t:"……あれ？"},
        {s:"玲央",c:"reo",t:"どうしたの？"},
        {s:"結衣",c:"yui",t:"鍵ない"},
        {t:"玲央の手が止まる。\n\nほんの一瞬。\n\nそれまで柔らかかった表情から、何かが消えた。"},
        {s:"玲央",c:"reo",t:"……家の？"},
        {s:"結衣",c:"yui",t:"うん"},
        {t:"バッグのポケットを探す。\n\n内ポケット。ポーチ。上着。\n\nない。"},
        {s:"玲央",c:"reo",t:"昨日は？"},
        {s:"結衣",c:"yui",t:"使った……と思う"},
        {s:"玲央",c:"reo",t:"帰ってきたとき？"},
        {s:"結衣",c:"yui",t:"うん"},
        {s:"玲央",c:"reo",t:"そのあと？"},
        {s:"結衣",c:"yui",t:"…………"},
        {s:"玲央",c:"reo",t:"姉さん"},
        {s:"結衣",c:"yui",t:"覚えてません"},
        {s:"玲央",c:"reo",t:"だと思った"},
        {t:"ため息をつきながら、玲央がしゃがみ込む。\n\nソファの下。テーブルの下。玄関。\n\n結衣も一緒に探す。\n\nけれど、見つからない。"},
        {s:"玲央",c:"reo",t:"昨日つけてたキーホルダーは？"},
        {s:"結衣",c:"yui",t:"白い猫のやつ"},
        {s:"玲央",c:"reo",t:"名前とか住所が分かるものは？"},
        {s:"結衣",c:"yui",t:"ないよ"},
        {s:"玲央",c:"reo",t:"……そっか"},
        {t:"少しだけ。\n\n玲央の声が低い。"},
        {s:"結衣",c:"yui",t:"そんなに心配しなくても大丈夫だよ。たぶんどこかに――"},
        {s:"玲央",c:"reo",t:"姉さん"},
        {t:"視線が合う。\n\nいつもの笑顔ではない。"},
        {s:"玲央",c:"reo",t:"鍵って、家に入れるものなんだよ"},
        {s:"結衣",c:"yui",t:"……うん"},
        {s:"玲央",c:"reo",t:"だから、なくしたなら『たぶん大丈夫』じゃない"},
        {t:"そう言って、玲央は玄関横の引き出しからスペアキーを取り出した。\n\nそして。\n\n渡さない。"},
        {s:"結衣",c:"yui",t:"玲央？"},
        {s:"玲央",c:"reo",t:"今日は俺が先に帰る"},
        {s:"結衣",c:"yui",t:"え？"},

  // 会話・地の文を読みやすいまとまりに圧縮。
  // 選択肢は必ず独立画面のまま残す。
  function compactSteps(steps){
    const result = [];
    let bucket = [];
    let chars = 0;

    const flush = () => {
      if(!bucket.length) return;
      result.push(bucket.length === 1 ? bucket[0] : {page:bucket});
      bucket = [];
      chars = 0;
    };

    for(const step of steps){
      if(step.choice || step.end){
        flush();
        result.push(step);
        continue;
      }

      const len = String(step.t || "").length;
      const isLongNarration = !step.s && len >= 145;

      // 長い地の文は単独表示。それ以外は3〜4発言程度を1タップにまとめる。
      if(isLongNarration){
        flush();
        result.push(step);
        continue;
      }

      const maxItems = chars < 130 ? 4 : 3;
      if(bucket.length >= maxItems || (bucket.length && chars + len > 260)){
        flush();
      }

      bucket.push(step);
      chars += len;
    }

    flush();
    return result;
  }

  function compactScenes(source){
    return source.map(scene => ({
      ...scene,
      steps:compactSteps(scene.steps)
    }));
  }

  const scenes = compactScenes(rawScenes);

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

  function deriveLean(){
    const r = Number(state.scores?.reo || 0);
    const m = Number(state.scores?.minato || 0);
    if(r > m) return "reo";
    if(m > r) return "minato";
    return "common";
  }

  function syncStoryState(){
    let story = {};
    try{
      story = JSON.parse(localStorage.getItem(STORY_STATE_KEY) || "{}");
      if(!story || typeof story !== "object") story = {};
    }catch(e){
      story = {};
    }

    story.version = 1;
    story.incident = {
      completed:Boolean(state.completed),
      lean:deriveLean(),
      scores:{
        reo:Number(state.scores?.reo || 0),
        minato:Number(state.scores?.minato || 0),
        caution:Number(state.scores?.caution || 0)
      },
      flags:{...(state.flags || {})},
      updatedAt:new Date().toISOString()
    };

    localStorage.setItem(STORY_STATE_KEY, JSON.stringify(story));
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return false;
      const parsed = JSON.parse(raw);
      if(typeof parsed.scene !== "number") return false;
      state = Object.assign(defaultState(), parsed);
      state.scores = Object.assign(defaultState().scores, parsed.scores || {});
      state.flags = Object.assign({}, parsed.flags || {});
      state.history = Array.isArray(parsed.history) ? parsed.history : [];
      return true;
    }catch(e){
      return false;
    }
  }

  function save(showToast=false){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    syncStoryState();
    if(showToast){
      els.saveNote.classList.add("show");
      clearTimeout(save._t);
      save._t=setTimeout(()=>els.saveNote.classList.remove("show"),900);
    }
  }

  function speakerClass(c){
    if(c==="reo") return "speaker reo";
    if(c==="minato") return "speaker minato";
    if(c==="yui") return "speaker yui";
    return "speaker";
  }

  function addHistory(step){
    if(!step || step.choice || step.end) return;

    const items = step.page ? step.page : [step];
    items.forEach(item => {
      const entry = {speaker:item.s || "", text:item.t || ""};
      const last = state.history[state.history.length-1];
      if(!last || last.speaker!==entry.speaker || last.text!==entry.text){
        state.history.push(entry);
        if(state.history.length>300) state.history.shift();
      }
    });
  }

  function currentScene(){
    return scenes[Math.min(state.scene, scenes.length-1)];
  }

  function currentStep(){
    if(state.branch){
      return state.branch[state.branchIndex];
    }
    const sc = currentScene();
    return sc.steps[state.step];
  }

  function overallProgress(){
    const sceneBase = state.scene / scenes.length;
    const sc = currentScene();
    const stepFrac = state.branch
      ? Math.min(1,(state.step+0.75)/Math.max(1,sc.steps.length))
      : Math.min(1,state.step/Math.max(1,sc.steps.length));
    return Math.max(0,Math.min(100,(sceneBase + stepFrac/scenes.length)*100));
  }

  function setSystem(text=""){
    els.system.textContent=text;

  function render(){
    if(state.completed){
      renderEnd();
      return;
    }

    const sc=currentScene();
    const st=currentStep();

    els.sceneHeader.hidden=false;
    els.textbox.hidden=false;
    els.sceneNo.textContent=sc.no;
    els.sceneTitle.textContent=sc.title;
    els.progress.style.width=overallProgress()+"%";
    els.choices.hidden=true;
    els.choices.innerHTML="";
    els.nextBtn.hidden=false;
    setSystem("");

    if(!st){
      advanceScene();
      return;
    }

    if(st.choice){
      renderChoice(st);
      return;
    }

    if(st.end){
      state.completed=true;
      save();
      renderEnd();
      return;
    }

    const items = st.page ? st.page : [st];

    if(items.length === 1 && items[0].s){
      const item = items[0];
      els.speaker.className=speakerClass(item.c);
      els.speaker.textContent=item.s;
      els.speaker.classList.remove("hidden");
      els.line.classList.remove("narration");
      els.line.textContent=item.t || "";
    }else if(items.length === 1){
      els.speaker.className="speaker hidden";
      els.speaker.textContent="";
      els.line.classList.add("narration");
      els.line.textContent=items[0].t || "";
    }else{
      els.speaker.className="speaker hidden";
      els.speaker.textContent="";
      els.line.classList.remove("narration");
      els.line.innerHTML=items.map(item=>{
        if(item.s){
          const cls=item.c ? ` ${escapeHtml(item.c)}` : "";
          return `<div class="page-block"><div class="inline-speaker${cls}">${escapeHtml(item.s)}</div><div class="dialogue-text">${nl2br(item.t || "")}</div></div>`;
        }
        return `<div class="page-block"><div class="narration-text">${nl2br(item.t || "")}</div></div>`;
      }).join("");
    }

    addHistory(st);
    save();
  }

  function renderChoice(st){
    els.speaker.className="speaker hidden";
    els.line.classList.add("narration");
    els.line.textContent=st.choice;
    els.nextBtn.hidden=true;

    els.choices.hidden=false;
    els.choices.innerHTML=`<div class="choice-title">選択してください</div>`;

    st.options.forEach((opt,i)=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="choice-btn";
      b.innerHTML=`<span class="choice-num">${i+1}</span>${escapeHtml(opt.label)}`;
      b.addEventListener("click",()=>choose(opt));
      els.choices.appendChild(b);
    });
  }

  function choose(opt){
    applyEffects(opt.effects || {});
    state.history.push({speaker:"CHOICE",text:opt.label});
    state.branch=compactSteps(clone(opt.branch || []));
    state.branchIndex=0;
    state.step += 1;
    save(true);

    if(!state.branch.length){
      state.branch=null;
      state.branchIndex=0;
    }
    render();
  }

  function applyEffects(effects){
    Object.entries(effects).forEach(([k,v])=>{
      if(k==="reo" || k==="minato" || k==="caution"){
        state.scores[k]=(state.scores[k]||0)+Number(v||0);
      }else{
        state.flags[k]=v;
      }
    });
  }

  function advance(){
    if(state.completed) return;

    if(state.branch){
      state.branchIndex += 1;
      if(state.branchIndex >= state.branch.length){
        state.branch=null;
        state.branchIndex=0;
      }
    }else{
      state.step += 1;
    }

    save();
    render();
  }

  function advanceScene(){
    if(state.scene < scenes.length-1){
      state.scene += 1;
      state.step = 0;
      state.branch = null;
      state.branchIndex = 0;
      save();
      render();
    }else{
      state.completed=true;
      save();
      renderEnd();
    }
  }

  function routeSummary(){
    const r=state.scores.reo||0;
    const m=state.scores.minato||0;
    if(r>m) return {
      label:"玲央寄り",
      text:"玲央への信頼が少し強く残りました。次章では、事件後の夜に玲央との追加会話へつなげられます。"
    };
    if(m>r) return {
      label:"湊寄り",
      text:"湊への信頼が少し強く残りました。次章では、翌朝の登校中に湊との追加会話へつなげられます。"

    return {

      text:"二人への気持ちはまだ同じくらい。次章も共通ルートを保ったまま進められます。"

        <p>開けてはいけない扉があることを、<br>結衣はまだ知らない。</p>
        <div class="end-actions">
          <a class="primary" id="nextChapterLink" href="#" style="display:inline-flex;text-decoration:none">事件後へ進む</a>
          <a class="secondary" href="intro.html" style="display:inline-flex;text-decoration:none">イントロへ戻る</a>
          <a class="secondary" href="../index.html" style="display:inline-flex;text-decoration:none">TOPへ戻る</a>
          <button class="secondary" type="button" id="endLog">バックログを見る</button>
          <button class="secondary" type="button" id="endRestart">最初から読む</button>
        </div>
      </div>
    `;
    state.completed=true;
    save();

    // after-incident では「個別ルート確定」ではなく初期傾向として扱う。
    const lean = deriveLean();
    syncStoryState();

    const nextUrl = new URL(NEXT_CHAPTER, window.location.href);
    nextUrl.searchParams.set("source", "incident");
    nextUrl.searchParams.set("route", lean); // 旧実装との互換用
    nextUrl.searchParams.set("lean", lean);
    nextUrl.searchParams.set("reo", String(state.scores.reo||0));
    nextUrl.searchParams.set("minato", String(state.scores.minato||0));
    nextUrl.searchParams.set("caution", String(state.scores.caution||0));

    document.getElementById("nextChapterLink").href = nextUrl.href;
    document.getElementById("endRestart").addEventListener("click",restart);
    document.getElementById("endLog").addEventListener("click",openLog);
  }

  function restart(){
    if(!confirm("最初から読み直しますか？\n現在の進行状況と選択はリセットされます。")) return;
    state=defaultState();
    localStorage.removeItem(STORAGE_KEY);

    try{
      const story = JSON.parse(localStorage.getItem(STORY_STATE_KEY) || "{}");
      if(story && typeof story === "object"){
        delete story.incident;
        localStorage.setItem(STORY_STATE_KEY, JSON.stringify(story));
      }
    }catch(e){}

    els.resumeBanner.classList.remove("show");
    save();
    render();
  }

  function openLog(){
    els.logBody.innerHTML="";
    if(!state.history.length){
      els.logBody.innerHTML='<p style="color:var(--muted)">まだバックログはありません。</p>';
    }else{
      state.history.forEach(item=>{
        const div=document.createElement("div");
        div.className="log-item";
        const name=item.speaker ? `<div class="log-name">${escapeHtml(item.speaker)}</div>` : "";
        div.innerHTML=name+`<div class="log-text">${escapeHtml(item.text)}</div>`;
        els.logBody.appendChild(div);
      });
    }
    els.logDialog.showModal();
    setTimeout(()=>{ els.logBody.scrollTop=els.logBody.scrollHeight; },20);
  }

  function nl2br(str){
    return escapeHtml(str).replace(/\n/g,"<br>");
  }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  els.nextBtn.addEventListener("click",advance);
  els.logBtn.addEventListener("click",openLog);
  els.closeLogBtn.addEventListener("click",()=>els.logDialog.close());
  els.restartBtn.addEventListener("click",restart);
  els.dismissResume.addEventListener("click",()=>els.resumeBanner.classList.remove("show"));

  document.addEventListener("keydown",(e)=>{
    if(els.logDialog.open) return;
    if(e.key==="Enter" || e.key===" "){
      const st=currentStep();
      if(st && !st.choice && !state.completed){
        e.preventDefault();
        advance();
      }
    }
  });

  const resumed=load();
  if(resumed && !state.completed && (state.scene>0 || state.step>0 || state.branch)){
    els.resumeBanner.classList.add("show");
  }

  render();
})();
</script>
</body>
</html>
